<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Aaditya! 🎂</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes float {
      0% { transform: translateY(100vh); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-10vh); opacity: 0.2; }
    }
    .floating-item {
      position: absolute;
      animation: float 12s linear infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-purple-50 to-sky-50 text-slate-800 font-sans selection:bg-rose-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MEMORIES = [
      {
        year: "Chapter 1",
        title: "We together 👀 :)",
        tag: "Classic Goofball",
        description: "Peak chaos and non-stop laughter—never a dull moment with you around!",
        image: "https://i.ibb.co/60VSp0Z/image.jpg"
      },
      {
        year: "Chapter 2",
        title: "Makad 2.0",
        tag: "Core Memory",
        description: "One for the books. The best memories are always the ones made together.",
        image: "https://i.ibb.co/3WkRj6P/image.jpg"
      }
    ];

    const SECRET_LETTER = `Dear Aaditya (Aadu),

Happy, happy birthday!
Happy Birthday ! 😂🎂❤️ ek varshani motha zhla pan akal ajun vadhli nhi e 😂 tuzhya aasuhyat happiness, success ani thodsh tri common sense yavh! 🤡✨ asch vadth raha, karan tuzhyasarka dusra namuna kuthe milnar nhi 😂🫶 ani ha party baki ahe! 😌🎉`;

    function BirthdayApp() {
      const [boxOpened, setBoxOpened] = useState(false);
      const [candlesBlown, setCandlesBlown] = useState(false);
      const [modalOpen, setModalOpen] = useState(false);
      const [typedLetter, setTypedLetter] = useState("");
      const [coupons, setCoupons] = useState([
        { id: 'date', title: 'Coffee & Dessert Date', desc: 'Redeemable anytime for your favorite brew, pastries, and no rush.', icon: '☕', unlocked: false },
        { id: 'dinner', title: 'Gourmet Dinner On Me', desc: 'Pick any restaurant in town. Good food, zero bill split.', icon: '🍽️', unlocked: false },
        { id: 'movie', title: 'Movie Marathon Pass', desc: 'You choose all the movies, endless popcorn included.', icon: '🎬', unlocked: false },
        { id: 'dayout', title: 'Mystery Weekend Trip', desc: 'One full day of curated spontaneous stops & road trip tunes.', icon: '🧭', unlocked: false }
      ]);

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      };

      const handleBlowCandles = () => {
        if (candlesBlown) return;
        setCandlesBlown(true);
        triggerConfetti();
      };

      const handleClaimCoupon = (id) => {
        setCoupons(prev => prev.map(c => c.id === id ? { ...c, unlocked: true } : c));
        triggerConfetti();
      };

      useEffect(() => {
        if (modalOpen) {
          setTypedLetter("");
          let index = 0;
          const timer = setInterval(() => {
            if (index < SECRET_LETTER.length) {
              setTypedLetter(SECRET_LETTER.slice(0, index + 1));
              index++;
            } else {
              clearInterval(timer);
            }
          }, 20);
          return () => clearInterval(timer);
        }
      }, [modalOpen]);

      return (
        <div className="min-h-screen relative overflow-x-hidden">
          {/* Section 1: Hero */}
          <section className="min-h-screen flex flex-col items-center justify-center text-center px-4">
            <span className="px-4 py-1.5 rounded-full bg-white/80 border border-rose-100 text-rose-500 text-xs font-semibold uppercase tracking-wider mb-4 shadow-sm">
              ✨ Special Celebration
            </span>
            <h1 className="text-4xl sm:text-6xl font-black bg-gradient-to-r from-rose-500 via-purple-600 to-indigo-600 bg-clip-text text-transparent pb-3">
              Happy Birthday, Aaditya!
            </h1>
            <p className="text-slate-600 text-base max-w-md mt-2 mb-8">
              A vault filled with memories, inside jokes, and special surprises just for you.
            </p>
            <a
              href="#surprise"
              className="px-8 py-4 rounded-full bg-gradient-to-r from-rose-500 to-purple-600 text-white font-bold shadow-lg shadow-rose-500/30"
            >
              Open Your Surprise 🎁
            </a>
          </section>

          {/* Section 2: Gift & Cake */}
          <section id="surprise" className="min-h-screen flex flex-col items-center justify-center px-4 py-16">
            <div className="max-w-md w-full bg-white/70 backdrop-blur-xl p-8 rounded-3xl border border-white shadow-xl text-center">
              <h2 className="text-2xl font-bold text-slate-800 mb-2">
                {!boxOpened ? "A Gift for Aadu" : !candlesBlown ? "Make a Wish!" : "Wish Granted! 🌟"}
              </h2>
              <p className="text-slate-500 text-xs sm:text-sm mb-6">
                {!boxOpened ? "Tap below to unwrap your gift" : !candlesBlown ? "Tap the candles to blow them out!" : "May this year bring you endless happiness!"}
              </p>

              <div className="min-h-[160px] flex items-center justify-center">
                {!boxOpened ? (
                  <button
                    onClick={() => { setBoxOpened(true); triggerConfetti(); }}
                    className="p-6 bg-gradient-to-tr from-rose-500 to-purple-500 text-white rounded-3xl shadow-lg text-4xl transform active:scale-95 transition"
                  >
                    🎁
                    <div className="text-xs uppercase font-bold tracking-wider mt-2">Tap to Open</div>
                  </button>
                ) : (
                  <div className="flex flex-col items-center">
                    <div className="flex gap-4 mb-2">
                      {[1, 2, 3].map(i => (
                        <div key={i} onClick={handleBlowCandles} className="cursor-pointer">
                          <div className="h-6 text-base">{!candlesBlown ? "🔥" : "💨"}</div>
                          <div className="w-3 h-8 bg-rose-300 rounded-t-sm mx-auto"></div>
                        </div>
                      ))}
                    </div>
                    <div className="w-44 h-14 bg-gradient-to-r from-amber-100 to-rose-200 rounded-2xl flex items-center justify-center font-bold text-xs text-rose-800 border-b-4 border-rose-300 shadow">
                      Happy Birthday Aadu 🎂
                    </div>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* Section 3: Memory Timeline */}
          <section className="py-16 px-4 max-w-lg mx-auto">
            <h2 className="text-2xl font-bold text-center text-slate-800 mb-8">📸 Memory Lane</h2>
            <div className="space-y-6">
              {MEMORIES.map((m, idx) => (
                <div key={idx} className="bg-white/80 backdrop-blur-md p-5 rounded-2xl border border-white shadow-md">
                  <img src={m.image} alt={m.title} className="w-full h-48 object-cover rounded-xl mb-3" />
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-rose-500">{m.tag}</span>
                    <span className="text-xs text-slate-400">{m.year}</span>
                  </div>
                  <h3 className="text-lg font-bold text-slate-800 mt-1">{m.title}</h3>
                  <p className="text-slate-600 text-xs sm:text-sm mt-1">{m.description}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Section 4: Coupons */}
          <section className="py-16 px-4 max-w-lg mx-auto">
            <h2 className="text-2xl font-bold text-center text-slate-800 mb-8">🎟️ Birthday Perks</h2>
            <div className="grid grid-cols-1 gap-4">
              {coupons.map((c) => (
                <div key={c.id} className="bg-white/80 p-5 rounded-2xl border border-white shadow-sm flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">{c.icon}</span>
                    <div>
                      <h4 className="font-bold text-sm text-slate-800">{c.title}</h4>
                      <p className="text-xs text-slate-500">{c.desc}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => handleClaimCoupon(c.id)}
                    disabled={c.unlocked}
                    className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${
                      c.unlocked ? "bg-emerald-100 text-emerald-700" : "bg-slate-900 text-white"
                    }`}
                  >
                    {c.unlocked ? "Claimed ✓" : "Redeem"}
                  </button>
                </div>
              ))}
            </div>

            <div className="mt-12 text-center">
              <button
                onClick={() => setModalOpen(true)}
                className="px-6 py-3 rounded-full bg-rose-500 text-white font-bold text-sm shadow-md"
              >
                Read Secret Note 💌
              </button>
            </div>
          </section>

          {/* Section 5: Modal */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-amber-50 rounded-2xl p-6 w-full max-w-md border border-amber-200 shadow-2xl max-h-[80vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-amber-200 pb-3 mb-3">
                  <span className="text-xs font-bold font-mono text-amber-800 uppercase">Sealed Letter</span>
                  <button onClick={() => setModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="text-sm font-serif whitespace-pre-line text-slate-800 leading-relaxed">
                  {typedLetter}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<BirthdayApp />, document.getElementById('root'));
  </script>
</body>
</html>
